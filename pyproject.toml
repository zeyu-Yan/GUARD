[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guard-unlearning"
version = "0.1.0"
description = "Guided trajectory alignment and answer-reasoning distillation for LRM unlearning."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
  "torch>=2.1",
  "transformers>=4.40",
  "accelerate>=0.29",
  "peft>=0.10",
  "safetensors>=0.4",
  "datasets>=2.19",
  "tokenizers>=0.15",
  "sentencepiece>=0.1.99",
  "protobuf>=4.25",
  "huggingface-hub>=0.22",
  "numpy>=1.23",
  "pyyaml>=6.0",
  "pyarrow>=15.0",
  "packaging>=23.0",
]

[tool.setuptools.packages.find]
where = ["src"]
